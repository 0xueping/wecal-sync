<div class="confirm-layout-wrapper fade-in" style="padding:24px;">
    <div class="glass-card" style="width:100%;max-width:320px;text-align:center;">
        <!-- 成功图标 -->
        <div style="width:48px;height:48px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 4px 16px rgba(16,185,129,0.3);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 13l4 4L19 7" />
            </svg>
        </div>
        
        <h2 class="page-title" style="color:var(--text-primary);margin-bottom:20px;">__MSG_eventCreatedSuccess__</h2>
        
        <!-- 详情 -->
        <div style="text-align:left;">
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.3);font-size:13px;">
                <span style="color:var(--text-muted);">__MSG_eventItem__</span>
                <span id="res-title" style="font-weight:600;color:var(--text-primary);text-align:right;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">--</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.3);font-size:13px;">
                <span style="color:var(--text-muted);">__MSG_startTime__</span>
                <span id="res-start" style="color:var(--text-secondary);">--</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.3);font-size:13px;">
                <span style="color:var(--text-muted);">__MSG_endTime__</span>
                <span id="res-end" style="color:var(--text-secondary);">--</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:13px;">
                <span style="color:var(--text-muted);">__MSG_location__</span>
                <span id="res-loc" style="color:var(--text-secondary);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;">--</span>
            </div>
        </div>
    </div>
    
    <!-- 同步提示 -->
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;">
        <div style="width:20px;height:20px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <span style="font-size:12px;color:var(--text-muted);">__MSG_syncedToICloud__</span>
    </div>
</div>
